services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./Backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      BASE_URL: http://localhost:8000
      MONGO_URL: mongodb://mongo:27017/shortit
      FRONTEND_ORIGIN: http://localhost:5174,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  mongo_data:
